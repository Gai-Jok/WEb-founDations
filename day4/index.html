<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture ideas before they disappear.</p>
    <nav>
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
    </nav>
    <button type="button" id="theme-toggle">Toggle Theme</button>
  </header>

  <main>
    <section>
      <h2>Write your note</h2>
      <label for="note-text">Your note</label>

      <textarea
      id="note-text"
      placeholder="Start typing your thoughts...."
      rows="8"
      ></textarea>

      
      <p id="char-count">Characters: 0</p>

      <p id="word-count">Words: 0 </p>

      <button type="button" id="clear-btn">Clear</button>  
    </section>
    <main> 
  <footer>
    <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
  </footer>
</body>
</html>
